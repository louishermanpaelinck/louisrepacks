<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Download</title>
</head>
<body>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get("id");

  if (!id) {
    history.back();
    return;
  }

  try {
    const url = new URL(id);

    if (
      !["e.pcloud.link", "u.pcloud.link"].includes(url.hostname) ||
      url.pathname !== "/publink/show"
    ) {
      throw new Error();
    }

    const html = await fetch(url).then(response => response.text());

    const match = html.match(/"downloadlink"\s*:\s*"([^"]+)"/i);

    if (!match) {
      throw new Error();
    }

    location.replace(
      match[1]
        .replaceAll("\\/", "/")
        .replaceAll("&amp;", "&")
    );
      setTimeout(2)
  } catch {
    history.back();
  }
})();
</script>
</body>
</html>
